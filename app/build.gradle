plugins {
    id 'com.android.application'
}

// Sentry-DSN nur aus Umgebung (SENTRY_DSN), ~/.gradle/gradle.properties oder der nicht
// eingecheckten local.properties. Nie im Repo. Ohne DSN bleibt Sentry aus.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.isFile()) localPropsFile.withInputStream { localProps.load(it) }
def sentryDsn = (providers.environmentVariable('SENTRY_DSN').orNull
        ?: providers.gradleProperty('SENTRY_DSN').orNull
        ?: localProps.getProperty('SENTRY_DSN') ?: '').trim()

// Vertriebsvariante: Standard ist die GitHub-APK (eigener Updater, REQUEST_INSTALL_PACKAGES).
// Mit `-Pdistribution=play` entsteht die Google-Play-Variante: ohne APK-Installer und
// Update-FileProvider, Updates über Google Play (In-App-Updates).
def playBuild = providers.gradleProperty('distribution').getOrElse('github') == 'play'
def distribution = playBuild ? 'play' : 'github'

android {
    namespace 'fm.welle.radio'
    compileSdk 36

    defaultConfig {
        applicationId "fm.welle.radio"
        minSdk 26
        targetSdk 36
        // Play-Build eine Nummer höher als die GitHub-APK 4.8 (33), damit Play-Updates darüber gehen.
        versionCode playBuild ? 34 : 33
        versionName "4.8"
        manifestPlaceholders = [sentryDsn: sentryDsn]
        buildConfigField 'boolean', 'PLAY_BUILD', playBuild.toString()
    }

    // Release credentials must stay outside Git. If they are not present,
    // assembleRelease produces an unsigned APK instead of falling back to a
    // repository-owned debug key.
    def releaseStore = providers.environmentVariable('RADIO_WELT_KEYSTORE').orNull
    signingConfigs {
        release {
            enableV1Signing false
            enableV2Signing true
            enableV3Signing true
            if (releaseStore) {
                storeFile file(releaseStore)
                storePassword providers.environmentVariable('RADIO_WELT_STORE_PASSWORD').orNull
                keyAlias providers.environmentVariable('RADIO_WELT_KEY_ALIAS').getOrElse('radiowelt')
                keyPassword providers.environmentVariable('RADIO_WELT_KEY_PASSWORD').orNull
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseStore) signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main.java.srcDirs += "src/$distribution/java"
        test.java.srcDirs += "src/${distribution}Test/java"
        if (playBuild) {
            // Manifest-Zusatz: entfernt REQUEST_INSTALL_PACKAGES und den Update-FileProvider.
            debug.manifest.srcFile 'src/play/AndroidManifest.xml'
            release.manifest.srcFile 'src/play/AndroidManifest.xml'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    // Alle Media3-Module immer auf derselben Version halten.
    def media3Version = '1.11.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16'
    implementation 'androidx.core:core:1.18.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-datasource:$media3Version"
    implementation "androidx.media3:media3-common:$media3Version"
    // Absturz-/Fehlerberichte (nur Core: kein NDK, kein Session Replay).
    implementation 'io.sentry:sentry-android-core:8.65.0'
    if (playBuild) {
        // Google Play In-App-Updates (nur Play-Variante).
        implementation 'com.google.android.play:app-update:2.1.0'
        // app-update zieht über play-services-basement androidx.fragment 1.0.0 nach (von Play als
        // veraltet markiert); aktuelle stabile Version erzwingen, wie bei IPTVstream.
        implementation 'androidx.fragment:fragment:1.9.1'
    }
}

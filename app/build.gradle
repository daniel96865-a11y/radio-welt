plugins {
    id 'com.android.application'
}

android {
    namespace 'fm.welle.radio'
    compileSdk 34

    defaultConfig {
        applicationId "fm.welle.radio"
        minSdk 26
        targetSdk 34
        versionCode 23
        versionName "3.8"
    }

    // Release credentials must stay outside Git. If they are not present,
    // assembleRelease produces an unsigned APK instead of falling back to a
    // repository-owned debug key.
    def releaseStore = providers.environmentVariable('RADIO_WELT_KEYSTORE').orNull
    signingConfigs {
        release {
            if (releaseStore) {
                storeFile file(releaseStore)
                storePassword providers.environmentVariable('RADIO_WELT_STORE_PASSWORD').orNull
                keyAlias providers.environmentVariable('RADIO_WELT_KEY_ALIAS').getOrElse('radiowelt')
                keyPassword providers.environmentVariable('RADIO_WELT_KEY_PASSWORD').orNull
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseStore) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-datasource:1.3.1'
    implementation 'androidx.media3:media3-common:1.3.1'
}

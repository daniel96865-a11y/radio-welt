name: Publish Radio Welt 3.8 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-3.8-once.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify prepared APK
        shell: bash
        run: sha256sum --check releases/RadioWelt-latest.apk.sha256
      - name: Publish Radio Welt 3.8
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cp releases/RadioWelt-latest.apk /tmp/RadioWelt-3.8.apk
          gh release create v3.8 /tmp/RadioWelt-3.8.apk releases/RadioWelt-latest.apk \
            --target b7fd65d7dd241792eae41f496f3e87fc46f17bb9 \
            --title "Radio Welt 3.8" \
            --notes-file releases/CHANGELOG.md \
            --latest
      - name: Remove one-time publisher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-3.8-once.yml
          git commit -m "Remove one-time Radio Welt 3.8 publisher"
          git push origin HEAD:main

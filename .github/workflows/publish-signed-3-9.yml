name: Publish signed 3.9 sources

on:
  push:
    paths:
      - .github/workflows/publish-signed-3-9.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Commit the signed 3.9 release files
        shell: bash
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import hashlib, pathlib, urllib.request
          files = [
              ("/.github/workflows/publish-release.yml", "992c49b37c262f726f0fdf91e2e366bd5e86cd0d12348befd2e20ad44189b393", 1692, "https://h.uguu.se/zCJnrVBk.yml"),
              ("/releases/RadioWelt-latest.apk.sha256", "57df4667e564fb7fd3ba7ced332476b4e8098b2b56b03c1857209db52e298e30", 87, "https://d.uguu.se/QtcrZdJb.txt"),
              ("/releases/CHANGELOG.md", "9a58078352e7399f359bcc9eb5f7f3e6271332eee2f14e5ffeed13020dc88e21", 724, "https://n.uguu.se/iXpWROSH.md"),
              ("/SIGNING.md", "957b7f3f9d779fc5f800a7696edb4696bdd8df7c591a7eab92a0314aeb433d04", 3580, "https://d.uguu.se/LXSZdHqn.md"),
              ("/app/build.gradle", "0d59583581bbdbdc4525564b595e329361ad618034d90813351c3de89da5f6a2", 1914, "https://h.uguu.se/PvaoROEB.gradle"),
              ("/docs/PUBLISH.md", "6d619a1501c48d0d1ac4aa5b9630d03942d6a3c8d97d6056e740616a19bd4010", 1536, "https://n.uguu.se/VtODFQeE.md"),
              ("/signing/RadioWelt-release-2026-10-fingerprints.txt", "8a310b3d72595d2bac2ef68561d55567a05d94c8700e843a3890f07396cd235e", 828, "https://n.uguu.se/iBYnEnKT.txt"),
              ("/signing/RadioWelt-release-2026-10-public.crt", "ed167ed0fe45fe5380ad64cccf573e50e096186bd6b379967e137f337c40fda5", 1497, "https://h.uguu.se/QjnEDOQD.crt"),
          ]
          root = pathlib.Path(".")
          for rel, sha, size, url in files:
              request = urllib.request.Request(url, headers={"User-Agent": "radio-welt-release"})
              with urllib.request.urlopen(request, timeout=120) as response:
                  data = response.read()
              got = hashlib.sha256(data).hexdigest()
              if got != sha or len(data) != size:
                  raise SystemExit(f"{rel} mismatch sha={got} size={len(data)}")
              dest = root / rel.lstrip("/")
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
              print(f"{rel} ok {len(data)} {got}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/publish-release.yml \
            releases/RadioWelt-latest.apk.sha256 \
            releases/CHANGELOG.md \
            SIGNING.md \
            app/build.gradle \
            docs/PUBLISH.md \
            signing/RadioWelt-release-2026-10-fingerprints.txt \
            signing/RadioWelt-release-2026-10-public.crt
          git commit -m "Publish the signed Radio Welt 3.9 release"
          git push origin HEAD:main
          git rev-parse HEAD

name: Inspect Radio Welt 3.7 version

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-radio-37.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect APK
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt -print | sort -V | tail -1)"
          "$AAPT" dump badging releases/RadioWelt-3.7.apk | head -1 > /tmp/badging.txt
          mkdir -p diagnostics
          cp /tmp/badging.txt diagnostics/radio-3.7-badging.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/radio-3.7-badging.txt
          git commit -m "Record Radio Welt 3.7 APK version diagnostics"
          git push

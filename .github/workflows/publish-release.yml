name: Publish Radio Welt APK

on:
  push:
    branches: [main]
    paths:
      - releases/RadioWelt-latest.apk
      - releases/RadioWelt-latest.apk.sha256
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radio-welt-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify the prepared APK and version
        id: version
        shell: bash
        run: |
          sha256sum --check releases/RadioWelt-latest.apk.sha256
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          source = Path('app/build.gradle').read_text()
          version = re.search(r'versionName "([0-9]+(?:\.[0-9]+)+)"', source).group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'name={version}\ntag=v{version}\n')
          PY
      - name: Publish the signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
        run: |
          gh release create "$RELEASE_TAG" releases/RadioWelt-latest.apk \
            --target "$GITHUB_SHA" --title "Radio Welt $RELEASE_VERSION" \
            --notes-file releases/CHANGELOG.md --latest
